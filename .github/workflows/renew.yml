name: IceHost Hourly KeepAlive

on:
  schedule:
    - cron: '0 */1 * * *'  # 保持定时触发
  workflow_dispatch:       # 支持手动触发

# 赋予 Actions 删除工作流历史运行记录的权限
permissions:
  actions: write
  contents: read

# 自动清理/并发控制：如果有新任务触发，取消上一期尚未结束的旧任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-start:
    runs-on: ubuntu-latest
    steps:
      - name: 检出私有核心仓库
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/my-private-scripts
          path: private-scripts
          token: ${{ secrets.CORE_SCRIPT_TOKEN || secrets.REPO_TOKEN || secrets.GH_PAT_PRIVATE_REPO }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r private-scripts/icehost/requirements.txt

      - name: Set up WARP
        uses: fscarmen/warp-on-actions@v1.1

      - name: Optimize Network MTU
        run: |
          # 针对 Wireguard/WARP 虚拟网卡优化 MTU 与 TCP MSS，彻底避免大包截断与 SSL EOF 异常
          sudo iptables -A FORWARD -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --clamp-mss-to-pmtu 2>/dev/null || true
          sudo ip link set dev wg0 mtu 1280 2>/dev/null || true
          sudo ip link set dev warp0 mtu 1280 2>/dev/null || true

      - name: Run check script
        env:
          ICEHOST_SERVER_URL: ${{ secrets.ICEHOST_SERVER_URL }}
          ICEHOST_COOKIES: ${{ secrets.ICEHOST_COOKIES }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          ALWAYS_NOTIFY: ${{ secrets.ALWAYS_NOTIFY || vars.ALWAYS_NOTIFY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python -u private-scripts/icehost/icehost_run.py

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        if: always() # 无论脚本运行成功还是失败，都执行清理
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 1 # 只保留最后 1 次运行记录
