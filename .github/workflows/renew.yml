name: IceHost Hourly KeepAlive

on:
  schedule:
    - cron: '0 */5 * * *'  # 🟢 开启自动触发：每 5 小时自动执行一次
  workflow_dispatch:       # 🟢 保留手动触发：允许你在网页上随时点击运行

jobs:
  check-and-start:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install seleniumbase requests

      - name: Set up WARP
        uses: fscarmen/warp-on-actions@v1.1

      - name: Run check script
        env:
          ICEHOST_SERVER_URL: ${{ secrets.ICEHOST_SERVER_URL }}
          ICEHOST_COOKIES: ${{ secrets.ICEHOST_COOKIES }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python icehost_run.py

      - name: Upload Debug Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icehost-debug-screenshot
          path: icehost_debug_screenshot.png
          if-no-files-found: ignore
          retention-days: 1 # 🟢 加上此行：只保留 1 天，过期自动删，避免占用空间

      # 🟢 如果后续依然报容量已满，可以直接把上面【Upload Debug Screenshot】整段删除，
      # 或者在下面将它们注释掉（在行首加 #）。
